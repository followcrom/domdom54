name: Claude Code Review

# Automation mode: a `prompt` is supplied, so Claude runs without waiting for an
# @claude mention. This runs the official code-review plugin on every PR and
# posts findings as inline comments.
#
# Claude skips drafts, closed PRs, PRs it judges too trivial to review, and any
# PR it has already commented on.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Read-only on purpose. This job comments; it does not change code. The
    # inline comments are posted by the action's own GitHub App auth, not by
    # GITHUB_TOKEN, so pull-requests: write is not needed here.
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"

          # Required: the action only starts the inline-comment MCP server when
          # --allowedTools names it, even though the skill's own frontmatter does too.
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'
